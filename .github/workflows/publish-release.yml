# Publishes a Halcira release from installer pieces pushed to an upload/<version> branch.
# The pieces exist because a single installer is larger than GitHub's 100 MB file limit.
# After the release is published, the upload branch is deleted.
name: Publish release

on:
  push:
    branches: ["upload/**"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Reassemble and verify the installer
        id: build
        run: |
          set -euo pipefail
          cd upload
          version=$(grep '^version:' latest.yml | awk '{print $2}')
          exe="Halcira-Setup-${version}.exe"
          cat Halcira-Setup.part* > "$exe"
          echo "$(cat SHA256)  $exe" | sha256sum -c -
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          # Halcira for Android, when this release includes it.
          apk=""
          for f in Halcira-Android-*.apk; do
            [ -e "$f" ] || continue
            echo "$(cat APK_SHA256)  $f" | sha256sum -c -
            apk="$f"
          done
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upload
          v="${{ steps.build.outputs.version }}"
          gh release create "v$v" \
            --repo "${{ github.repository }}" \
            --target main \
            --title "Halcira $v" \
            --notes-file NOTES.md \
            "${{ steps.build.outputs.exe }}" "${{ steps.build.outputs.exe }}.blockmap" latest.yml \
            ${{ steps.build.outputs.apk }}

      - name: Remove the upload branch
        if: success()
        run: git push origin --delete "${{ github.ref_name }}"
